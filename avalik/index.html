<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piletikassa</title>
</head>
<body>

<header>
    <h1>Piletikassa</h1>

    <nav>
        <a href="#sundmused">Sündmused</a>
        <a href="#otsing">Otsing</a>
    </nav>
</header>

<main>
    <section id="sundmused">
        <h2>Sündmused</h2>

        <table>
            <thead>
                <tr>
                    <th>Kuupäev</th>
                    <th>Algus</th>
                    <th>Toimumiskoht</th>
                    <th>Vabu kohti</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>20.09.2026</td>
                    <td>18:00</td>
                    <td>Narva</td>
                    <td>12</td>
                </tr>
                <tr>
                    <td>25.09.2026</td>
                    <td>19:00</td>
                    <td>Tartu</td>
                    <td>8</td>
                </tr>
                <tr>
                    <td>30.09.2026</td>
                    <td>17:30</td>
                    <td>Tallinn</td>
                    <td>20</td>
                </tr>
            </tbody>
        </table>
    </section>

    <section id="otsing">
        <h2>Otsi sündmusi</h2>

        <form method="post">
            <fieldset>
                <legend>Otsinguvalikud</legend>

                <p>
                    <label for="from">Kuupäev:</label>
                    <input type="date" id="from" name="from">
                </p>

                <p>
                    <label for="available">Vabu kohti vähemalt:</label>
                    <input type="number" id="available" name="available" min="1" max="24">
                </p>

                <p>
                    <label for="sort">Sorteerimine:</label>
                    <select id="sort" name="sort">
                        <option value="date">Kuupäeva järgi</option>
                        <option value="available">Vabade kohtade järgi</option>
                    </select>
                </p>

                <p>
                    <input type="checkbox" id="availableOnly" name="availableOnly" value="1">
                    <label for="availableOnly">Ainult vabade kohtadega sündmused</label>
                </p>

                <p>
                    <label for="email">E-post:</label>
                    <input type="email" id="email" name="email">
                </p>

                <button type="submit">Otsi</button>
            </fieldset>
        </form>
    </section>
</main>

<footer>
    <p>Piletikassa 2026</p>
</footer>

</body>
</html>
