<!DOCTYPE html>
<html lang="et">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CSS jõudluse mõõtmine</title>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
        }

        button {
            margin-inline-end: 1rem;
            margin-block-end: 1rem;
            padding: 0.75rem 1rem;
        }

        #cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
            gap: 1rem;
        }

        .card {
            border: 1px solid #999;
            padding: 1rem;
            min-block-size: 8rem;
        }

        .performance-auto .card {
            content-visibility: auto;
            contain-intrinsic-size: auto 150px;
        }

        #results {
            white-space: pre-wrap;
            font-family: monospace;
            margin-block: 2rem;
            padding: 1rem;
            border: 1px solid #999;
        }
    </style>
</head>

<body>

    <h1>CSS jõudluse mõõtmine</h1>

    <button id="normal-test">
        Mõõda ilma content-visibility-ta
    </button>

    <button id="auto-test">
        Mõõda content-visibility: auto
    </button>

    <button id="selector-test">
        Mõõda valijad
    </button>

    <div id="results"></div>

    <main id="cards"></main>

    <script src="performance.js"></script>

</body>

</html>
