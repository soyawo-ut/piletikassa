<!DOCTYPE html>
<html lang="et">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Piletikassa - ostuvorm</title>

    <link rel="stylesheet" href="layers.css" />
</head>

<body>

    <main id="purchase" class="page">

        <h1>Ostuvorm</h1>

        <form id="purchase-form" novalidate>

            <fieldset>
                <legend>Ostja andmed</legend>

                <p>
                    <label for="name">Nimi</label>

                    <input
                        class="field"
                        type="text"
                        id="name"
                        name="name"
                        required
                        minlength="2"
                        aria-describedby="name-error"
                    />

                    <span id="name-error" class="error" aria-live="polite"></span>
                </p>

                <p>
                    <label for="email">E-post</label>

                    <input
                        class="field"
                        type="email"
                        id="email"
                        name="email"
                        required
                        aria-describedby="email-error"
                    />

                    <span id="email-error" class="error" aria-live="polite"></span>
                </p>

                <p>
                    <label for="email-confirm">Korda e-posti</label>

                    <input
                        class="field"
                        type="email"
                        id="email-confirm"
                        name="email-confirm"
                        required
                        aria-describedby="email-confirm-error"
                    />

                    <span
                        id="email-confirm-error"
                        class="error"
                        aria-live="polite"
                    ></span>
                </p>

                <p>
                    <label for="phone">Telefon</label>

                    <input
                        class="field"
                        type="tel"
                        id="phone"
                        name="phone"
                        required
                        pattern="\+?[0-9 ]{7,15}"
                        aria-describedby="phone-error"
                    />

                    <span id="phone-error" class="error" aria-live="polite"></span>
                </p>

            </fieldset>

            <fieldset>
                <legend>Tellimuse andmed</legend>

                <p>
                    <label for="quantity">Piletite arv</label>

                    <input
                        class="field"
                        type="number"
                        id="quantity"
                        name="quantity"
                        required
                        min="1"
                        max="6"
                        step="1"
                        aria-describedby="quantity-error"
                    />

                    <span
                        id="quantity-error"
                        class="error"
                        aria-live="polite"
                    ></span>
                </p>

                <p>
                    <label for="event">Sündmus</label>

                    <select
                        class="field"
                        id="event"
                        name="event"
                        required
                        aria-describedby="event-error"
                    >
                        <option value="">Vali sündmus</option>
                        <option value="narva">Kontsert Narvas</option>
                        <option value="tartu">Kontsert Tartus</option>
                        <option value="tallinn">Kontsert Tallinnas</option>
                    </select>

                    <span id="event-error" class="error" aria-live="polite"></span>
                </p>

                <p>
                    <label for="postal-code">Postiindeks</label>

                    <input
                        class="field"
                        type="text"
                        id="postal-code"
                        name="postal-code"
                        required
                        pattern="[0-9]{5}"
                        aria-describedby="postal-code-error"
                    />

                    <span
                        id="postal-code-error"
                        class="error"
                        aria-live="polite"
                    ></span>
                </p>

                <p>
                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        required
                        aria-describedby="terms-error"
                    />

                    <label for="terms">
                        Nõustun tingimustega
                    </label>

                    <span id="terms-error" class="error" aria-live="polite"></span>
                </p>

            </fieldset>

            <button type="submit">
                Osta
            </button>

        </form>

        <section aria-labelledby="cards-title">
            <h2 id="cards-title">Näidisvalijad</h2>

            <ul class="cards">
                <li>
                    <h3>Tavaline kaart</h3>
                    <p>Näidis :is() ja :not() jaoks.</p>
                </li>

                <li class="featured">
                    <h3>Esiletõstetud kaart</h3>
                    <p>Näidis spetsiifilisuse arvutamiseks.</p>
                </li>
            </ul>
        </section>

    </main>

    <script type="module" src="validation.js"></script>

</body>

</html>
